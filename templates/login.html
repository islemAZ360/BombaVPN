{% extends 'base.html' %}
{% block content %}
<div class="card" style="max-width: 420px; margin: 6rem auto; text-align: center;">
    
    <!-- Logo Icon -->
    <div style="margin-bottom: 1.5rem;">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="filter: drop-shadow(0 0 15px var(--primary-glow));">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        </svg>
    </div>

    <h2 style="margin-bottom: 0.5rem;">{{ _('Login') }}</h2>
    <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 2rem;">{{ _('LoginSubtitle') }}</p>
    
    <button id="google-btn" class="btn-google">
        <svg width="20" height="20" viewBox="0 0 48 48">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        {{ _('GoogleSignIn') }}
    </button>

</div>
{% endblock %}
{% block scripts %}
<script type="module">
    import { auth, signInWithPopup, googleProvider, onAuthStateChanged } from "{{ url_for('static', filename='firebase_config.js') }}";
    
    const btn = document.getElementById('google-btn');
    const originalBtnContent = btn.innerHTML;

    async function handleSessionLogin(user) {
        try {
            const idToken = await user.getIdToken(true);
            const response = await fetch('/api/sessionLogin', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ idToken: idToken })
            });
            if (response.ok) {
                showToast('success', '{{ _("LoginSuccessTitle") }}', '{{ _("LoginSuccessMsg") }}');
                setTimeout(() => { window.location.href = '/'; }, 1000);
            } else {
                resetBtn();
                showToast('error', '{{ _("Error") }}', '{{ _("LoginError") }}');
            }
        } catch (error) {
            resetBtn();
            showToast('error', '{{ _("Error") }}', error.message);
        }
    }

    function resetBtn() {
        btn.disabled = false;
        btn.innerHTML = originalBtnContent;
    }

    // Google Sign-In button click
    btn.addEventListener('click', () => {
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span>';
        
        signInWithPopup(auth, googleProvider).then((result) => {
            if (result && result.user) {
                handleSessionLogin(result.user);
            }
        }).catch((error) => {
            resetBtn();
            if (error.code && error.code !== 'auth/popup-closed-by-user') {
                showToast('error', '{{ _("Error") }}', error.message);
            }
        });
    });

</script>
{% endblock %}
