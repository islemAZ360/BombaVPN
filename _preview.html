<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GalaxyVPN Preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <canvas id="stars-canvas" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; background: radial-gradient(ellipse at 50% 40%, #0a1428 0%, #060c1a 50%, #02040a 100%);"></canvas>

    <div class="top-bar">
        <div class="logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
            GalaxyVPN
        </div>
        <div class="lang-switcher">
            <select><option>English</option><option>العربية</option></select>
        </div>
    </div>

    <div class="container">
        <!-- Login-style card -->
        <div class="card" style="max-width: 420px; margin: 2rem auto; text-align: center;">
            <div style="margin-bottom: 1.5rem;">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="1.5" style="filter: drop-shadow(0 0 15px var(--primary-glow));">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                </svg>
            </div>
            <h2 style="margin-bottom: 0.5rem;">Login</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 2rem;">Sign in to access your VPN</p>
            <button class="btn btn-primary" style="margin-bottom: 1rem;">
                Sign in with Google
            </button>
            <div class="auth-links"><a href="#">Don't have an account?</a></div>
        </div>

        <!-- Dashboard-style card -->
        <div class="card" style="max-width: 700px; margin: 2rem auto;">
            <h3>Your Subscription</h3>
            <span class="badge badge-success" style="margin-bottom: 1rem; display: inline-flex;">ACTIVE</span>
            <div style="display: flex; background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; overflow: hidden; margin-top: 1rem;">
                <div style="padding: 14px 16px; flex-grow: 1; font-family: 'Courier New', monospace; color: #a0a0a0; font-size: 0.85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                    vless://example-connection-string...
                </div>
                <button style="background: rgba(255,255,255,0.05); border: none; border-left: 1px solid rgba(255,255,255,0.1); color: var(--primary); padding: 0 24px; cursor: pointer; font-weight: bold;">Copy</button>
            </div>
        </div>

        <!-- Plan cards -->
        <div class="card" style="max-width: 700px; margin: 2rem auto; background: transparent; border: none; box-shadow: none; backdrop-filter: none;">
            <h3 style="text-align: center;">Select Plan</h3>
            <div class="plans-grid">
                <div class="plan-card">
                    <div class="plan-name">Russia VPS</div>
                    <div class="plan-price">200 ₽</div>
                    <div class="plan-duration">30 Days</div>
                </div>
                <div class="plan-card selected">
                    <div class="plan-name">Germany VPS</div>
                    <div class="plan-price">350 ₽</div>
                    <div class="plan-duration">30 Days</div>
                </div>
                <div class="plan-card">
                    <div class="plan-name">US VPS</div>
                    <div class="plan-price">500 ₽</div>
                    <div class="plan-duration">60 Days</div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/background.js"></script>
</body>
</html>
